name: Android CI

# Build debug + unit test di setiap push/PR ke main.
# Rilis APK dilakukan workflow android-release.yml (dipicu tag v*).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v2.0.11: google-services.json TIDAK ada di repo (di-.gitignore, berisi
      # kunci proyek) — tulis ulang dari secret sebelum build, kalau tidak
      # plugin google-services gagal ("File google-services.json is missing").
      # Secret GOOGLE_SERVICES_JSON = isi app/google-services.json di-encode
      # base64 (dibuat Faygo di Settings > Secrets and variables > Actions).
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v4: default packages tidak lagi menyertakan paket legacy `tools`
      # (dihapus Google ~2026-09-15) — v3 gagal di step ini.
      # Pasang eksplisit platform + build-tools yang dibutuhkan proyek
      # (compileSdk 34): v4 default hanya memasang platform-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build debug APK
        run: |
          set -o pipefail
          # 2>&1 penting: error Kotlin/Gradle keluar lewat stderr — tanpa ini
          # build.log hanya berisi stdout (artefak run #4 cuma 479 byte).
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: animelovers-debug
          path: app/build/outputs/apk/debug/app-debug.apk
