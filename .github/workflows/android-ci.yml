name: Android CI

# Build debug + unit test di setiap push/PR ke main.
# Rilis APK dilakukan workflow android-release.yml (dipicu tag v*).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        # v4: default packages tidak lagi menyertakan paket legacy `tools`
        # (dihapus Google ~2026-09-15) — v3 gagal di step ini.

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: animelovers-debug
          path: app/build/outputs/apk/debug/app-debug.apk
