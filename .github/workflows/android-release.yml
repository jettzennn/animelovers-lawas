name: Android Release

# Rilis APK ke GitHub Release — dipicu tag v* (mis. v1.0.0).
# Rahasia yang dibutuhkan (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64  — isi keystore.jks yang di-encode base64
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD — kredensial keystore
# Keystore dibuat sekali dengan keytool (lihat README.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v2.0.11: google-services.json TIDAK ada di repo (di-.gitignore, berisi
      # kunci proyek) — tulis ulang dari secret sebelum build, kalau tidak
      # plugin google-services gagal ("File google-services.json is missing").
      # Secret GOOGLE_SERVICES_JSON = isi app/google-services.json di-encode
      # base64 (dibuat Faygo di Settings > Secrets and variables > Actions).
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v4: default packages tidak lagi menyertakan paket legacy `tools`
      # (dihapus Google ~2026-09-15) — v3 gagal di step ini.
      # Pasang eksplisit platform + build-tools yang dibutuhkan proyek
      # (compileSdk 34): v4 default hanya memasang platform-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          cat > keystore.properties <<'EOF'
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: |
          set -o pipefail
          # 2>&1 penting: error Kotlin/Gradle keluar lewat stderr — tanpa ini
          # build.log hanya berisi stdout.
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify \
            --verbose app/build/outputs/apk/release/app-release.apk

      - name: Size gate (maksimal 10 MB)
        run: |
          SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          echo "Ukuran APK: $SIZE byte"
          if [ "$SIZE" -gt 10485760 ]; then
            echo "APK melebihi 10 MB — rilis dibatalkan."
            exit 1
          fi

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            animelovers-lawas-${{ github.ref_name }}.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: animelovers-lawas-${{ github.ref_name }}.apk
          generate_release_notes: true
